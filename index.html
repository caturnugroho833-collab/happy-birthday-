<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>happy birthday sayang 🤍</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ========================= */
/* BASIC */
/* ========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    overflow:hidden;
    background:#0f0f0f;
    color:white;
    text-align:center;
}

/* ========================= */
/* BACKGROUND GLOW */
/* ========================= */

body::before{
    content:'';
    position:fixed;
    width:100%;
    height:100%;

    background:
    radial-gradient(circle at top,#ff4d8d33,transparent 40%),
    radial-gradient(circle at bottom,#9d4edd33,transparent 40%);

    z-index:-5;
}

/* ========================= */
/* COUNTDOWN */
/* ========================= */

#countdownScreen{
    position:fixed;
    width:100%;
    height:100vh;

    background:
    radial-gradient(circle,#1a1a1a,#0a0a0a);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    z-index:10000;
}

#countNumber{
    font-size:130px;

    text-shadow:
    0 0 20px #ff4d8d,
    0 0 50px #ff4d8d,
    0 0 90px #ff4d8d;

    animation:pulse 1s infinite;
}

#countText{
    margin-top:20px;
    color:#d8d8d8;
    letter-spacing:2px;
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.1);
    }

    100%{
        transform:scale(1);
    }

}

/* ========================= */
/* CONFETTI */
/* ========================= */

.confetti-container{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:999;
}

.confetti{
    position:absolute;
    width:12px;
    height:24px;

    animation:
    confettiFall linear infinite;
}

/* warna */

.confetti:nth-child(1){
    left:5%;
    background:#ff4d8d;
    animation-duration:7s;
}

.confetti:nth-child(2){
    left:15%;
    background:#ffd166;
    animation-duration:9s;
}

.confetti:nth-child(3){
    left:25%;
    background:#4cc9f0;
    animation-duration:8s;
}

.confetti:nth-child(4){
    left:35%;
    background:#9d4edd;
    animation-duration:10s;
}

.confetti:nth-child(5){
    left:45%;
    background:#ff8fab;
    animation-duration:7s;
}

.confetti:nth-child(6){
    left:55%;
    background:#80ed99;
    animation-duration:9s;
}

.confetti:nth-child(7){
    left:65%;
    background:#ffd166;
    animation-duration:8s;
}

.confetti:nth-child(8){
    left:75%;
    background:#ff4d8d;
    animation-duration:10s;
}

.confetti:nth-child(9){
    left:85%;
    background:#4cc9f0;
    animation-duration:7s;
}

.confetti:nth-child(10){
    left:95%;
    background:#ff8fab;
    animation-duration:9s;
}

@keyframes confettiFall{

    0%{
        transform:
        translateY(-10vh)
        rotate(0deg);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:
        translateY(110vh)
        rotate(720deg);

        opacity:0;
    }

}

/* ========================= */
/* CINEMATIC OPENING */
/* ========================= */

#cinematicOpening{
    position:fixed;
    width:100%;
    height:100vh;

    background:
    linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.8)),
    url('foto1.jpg');

    background-size:cover;
    background-position:center;

    display:none;
    justify-content:center;
    align-items:center;

    z-index:9999;

    animation:zoomBg 10s ease forwards;
}

@keyframes zoomBg{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.1);
    }

}

.cinematic-content{
    animation:fadeUp 2s ease;
    padding:20px;
}

.cinematic-content h1{
    font-size:55px;

    text-shadow:
    0 0 15px rgba(255,255,255,0.5),
    0 0 35px rgba(255,77,141,0.7);
}

.cinematic-content p{
    margin-top:18px;
    color:#dddddd;
}

.enterBtn{
    margin-top:40px;
    padding:15px 35px;
    border:none;
    border-radius:40px;
    background:#ff4d8d;
    color:white;
    cursor:pointer;
    font-size:16px;

    box-shadow:
    0 0 20px rgba(255,77,141,0.6);

    transition:0.3s;
}

.enterBtn:hover{
    transform:scale(1.08);
}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* ========================= */
/* CAKE SCREEN */
/* ========================= */

#cakeScreen{
    position:fixed;
    width:100%;
    height:100vh;

    background:#0f0f0f;

    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    z-index:9998;
}

.cake-name{

    margin-bottom:25px;

    font-size:34px;

    text-shadow:
    0 0 10px #ff4d8d,
    0 0 25px #ff4d8d,
    0 0 45px #ff4d8d;

    animation:
    glowName 2s infinite alternate;
}

@keyframes glowName{

    from{
        text-shadow:
        0 0 10px #ff4d8d,
        0 0 25px #ff4d8d;
    }

    to{
        text-shadow:
        0 0 20px #ff4d8d,
        0 0 45px #ff4d8d,
        0 0 70px #ff4d8d;
    }

}

.cake{
    position:relative;
    margin-top:30px;
}

.cake-img{
    width:270px;

    filter:
    drop-shadow(0 0 20px rgba(255,77,141,0.6));

    animation:
    floatingCake 3s ease-in-out infinite;
}

@keyframes floatingCake{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }

}

/* lilin */

.candle{
    position:absolute;

    width:16px;
    height:70px;

    background:white;

    top:30px;
    left:127px;

    border-radius:10px;

    z-index:2;

    cursor:pointer;
}

/* api */

.real-flame{
    position:absolute;

    width:24px;
    height:38px;

    background:
    radial-gradient(circle,
    #fff6b7 10%,
    #ffcc00 35%,
    #ff7300 65%,
    transparent 100%);

    top:-2px;
    left:123px;

    border-radius:50%;

    animation:
    fireMove 0.12s infinite alternate,
    fireGlow 1s infinite alternate;

    z-index:3;
}

@keyframes fireMove{

    from{
        transform:
        scale(1)
        rotate(-2deg);
    }

    to{
        transform:
        scale(1.08)
        rotate(2deg);
    }

}

@keyframes fireGlow{

    from{
        box-shadow:
        0 0 12px #ff9900,
        0 0 25px #ff7300,
        0 0 40px #ff0000;
    }

    to{
        box-shadow:
        0 0 18px #ffd000,
        0 0 35px #ff8800,
        0 0 55px #ff2200;
    }

}

#cakeText{
    margin-top:30px;
    color:#d8d8d8;
}

/* ========================= */
/* MAIN CONTENT */
/* ========================= */

#mainContent{
    display:none;
    padding:50px 20px;
    overflow:auto;
    height:100vh;
}

h2{
    font-size:52px;
    margin-top:40px;
}

/* typing */

#typing{
    max-width:850px;
    margin:auto;
    margin-top:40px;
    line-height:2;
    font-size:18px;
    white-space:pre-line;
}

/* gallery */

.gallery{
    margin-top:70px;
}

.gallery img{
    width:240px;
    height:320px;
    object-fit:cover;
    border-radius:25px;
    margin:12px;

    box-shadow:
    0 0 25px rgba(255,255,255,0.08);

    transition:0.4s;
}

.gallery img:hover{
    transform:translateY(-10px);
}

/* video */

video{
    width:340px;
    border-radius:25px;
    margin-top:50px;
}

/* ========================= */
/* FLOATING LOVE */
/* ========================= */

.hearts span{
    position:fixed;
    color:#ff4d8d;
    font-size:24px;
    top:-10%;
    animation:loveFall linear infinite;

    text-shadow:
    0 0 10px #ff4d8d;
}

@keyframes loveFall{

    0%{
        transform:translateY(-10vh);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateY(110vh);
        opacity:0;
    }

}

/* ========================= */
/* LOVE MUTER */
/* ========================= */

.text-love{
    position:absolute;
    top:50%;
    left:50%;

    width:500px;
    height:500px;

    transform:
    translate(-50%,-50%);

    animation:
    spinTextLove 18s linear infinite;

    z-index:-1;
}

.text-love span{
    position:absolute;
    left:50%;
    top:50%;

    font-size:32px;
    color:#ff4d8d;

    opacity:0.45;

    text-shadow:
    0 0 12px #ff4d8d,
    0 0 25px #ff4d8d;
}

@keyframes spinTextLove{

    from{
        transform:
        translate(-50%,-50%)
        rotate(0deg);
    }

    to{
        transform:
        translate(-50%,-50%)
        rotate(360deg);
    }

}

.text-love span:nth-child(1){
    transform:translate(-50%,-220px);
}

.text-love span:nth-child(2){
    transform:translate(120px,-180px);
}

.text-love span:nth-child(3){
    transform:translate(220px,-50px);
}

.text-love span:nth-child(4){
    transform:translate(180px,120px);
}

.text-love span:nth-child(5){
    transform:translate(-50%,220px);
}

.text-love span:nth-child(6){
    transform:translate(-250px,120px);
}

.text-love span:nth-child(7){
    transform:translate(-320px,-50px);
}

.text-love span:nth-child(8){
    transform:translate(-250px,-180px);
}

/* ========================= */
/* FIREWORKS */
/* ========================= */

.fireworks{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-1;
}

.firework{
    position:absolute;
    width:8px;
    height:8px;
    border-radius:50%;

    animation:
    explode 2s ease-out infinite;
}

.firework:nth-child(1){
    top:20%;
    left:25%;
    background:#ff4d8d;
    box-shadow:0 0 20px #ff4d8d;
}

.firework:nth-child(2){
    top:35%;
    left:70%;
    background:#ffd166;
    box-shadow:0 0 20px #ffd166;
    animation-delay:1s;
}

.firework:nth-child(3){
    top:70%;
    left:45%;
    background:#9d4edd;
    box-shadow:0 0 20px #9d4edd;
    animation-delay:2s;
}

.firework:nth-child(4){
    top:55%;
    left:80%;
    background:#4cc9f0;
    box-shadow:0 0 20px #4cc9f0;
    animation-delay:3s;
}

@keyframes explode{

    0%{
        transform:scale(0);
        opacity:1;
    }

    100%{
        transform:scale(18);
        opacity:0;
    }

}

</style>
</head>

<body>

<!-- countdown -->

<div id="countdownScreen">

    <div id="countNumber">5</div>

    <div id="countText">
        a little surprise for you 🤍
    </div>

</div>

<!-- confetti -->

<div class="confetti-container">

    <span class="confetti"></span>
    <span class="confetti"></span>
    <span class="confetti"></span>
    <span class="confetti"></span>
    <span class="confetti"></span>
    <span class="confetti"></span>
    <span class="confetti"></span>
    <span class="confetti"></span>
    <span class="confetti"></span>
    <span class="confetti"></span>

</div>

<!-- cinematic -->

<div id="cinematicOpening">

    <div class="cinematic-content">

        <h1>for my favorite girl 🤍</h1>

        <p>i made this only for you.</p>

        <button class="enterBtn" onclick="openCake()">
            enter my world ✨
        </button>

    </div>

</div>

<!-- cake -->

<div id="cakeScreen">

    <h2 class="cake-name">
        happy birthday sayang 🤍
    </h2>

    <div class="cake">

        <div class="real-flame"
        id="realFlame"></div>

        <div class="candle"
        onclick="blowCandle()"></div>

        <img src="cake.png"
        class="cake-img">

    </div>

    <p id="cakeText">
        klik lilinnya buat matiin 🎂
    </p>

</div>

<!-- main -->

<div id="mainContent">

<!-- fireworks -->

<div class="fireworks">

    <div class="firework"></div>
    <div class="firework"></div>
    <div class="firework"></div>
    <div class="firework"></div>

</div>

<!-- floating hearts -->

<div class="hearts">

    <span style="left:5%; animation-duration:7s;">❤</span>
    <span style="left:15%; animation-duration:10s;">❤</span>
    <span style="left:25%; animation-duration:8s;">❤</span>
    <span style="left:40%; animation-duration:12s;">❤</span>
    <span style="left:55%; animation-duration:9s;">❤</span>
    <span style="left:70%; animation-duration:11s;">❤</span>
    <span style="left:85%; animation-duration:7s;">❤</span>

</div>

<h2>happy birthday sayang 🤍</h2>

<!-- love muter -->

<div class="text-love">

    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>

</div>

<p id="typing"></p>

<button onclick="playMusic()">
    play music 🎵
</button>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mp3">
</audio>

<div class="gallery">

    <img src="foto1.jpg">
    <img src="foto2.jpg">
    <img src="foto3.jpg">

</div>

</div>

<script>

/* countdown */

let count = 5;

const counter =
document.getElementById("countNumber");

const countdown =
setInterval(() => {

    count--;

    counter.innerHTML = count;

    if(count <= 0){

        clearInterval(countdown);

        counter.innerHTML =
        "happy birthday 🤍";

        setTimeout(() => {

            document.getElementById("countdownScreen")
            .style.display = "none";

            document.getElementById("cinematicOpening")
            .style.display = "flex";

        },2000);

    }

},1000);

/* open cake */

function openCake(){

    document.getElementById("cinematicOpening")
    .style.display = "none";

    document.getElementById("cakeScreen")
    .style.display = "flex";

}

/* blow candle */

function blowCandle(){

    document.getElementById("realFlame")
    .style.display = "none";

    document.getElementById("cakeText")
    .innerHTML =
    "yay lilinnya mati 🎂";

    setTimeout(() => {

        document.getElementById("cakeScreen")
        .style.display = "none";

        document.getElementById("mainContent")
        .style.display = "block";

        playMusic();

    },1500);

}

/* music */

function playMusic(){

    document.getElementById("music").play();

}

/* typing */

const text = `happy birthday sayang 🤍

hari ini dunia lagi nambah satu umur
buat seseorang yang paling berarti di hidup aku.

makasih ya,
karena kamu udah hadir sejauh ini.

aku suka semua tentang kamu,
cara kamu ketawa,
cara kamu malu-malu,
cara kamu banyak ngomong pas chat
tapi diem pas ketemu 😭

dan jujur,
itu semua bikin aku makin jatuh cinta.

aku harap di umur kamu yang baru ini,
semua hal baik dateng satu-satu.

semoga hati kamu tenang,
langkah kamu dimudahin,
dan senyum kamu nggak banyak hilang lagi ya.

thank you for staying.
thank you for existing.
and thank you for being you 🤍`;

let i = 0;

function typingEffect(){

    if(i < text.length){

        document.getElementById("typing")
        .innerHTML += text.charAt(i);

        i++;

        setTimeout(typingEffect,35);

    }

}

typingEffect();

</script>

</body>
</html>
